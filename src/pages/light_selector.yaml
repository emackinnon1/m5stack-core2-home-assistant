# Light selector (scrollable list) + individual light detail state.
# Rendering/touch handling for these lives in menu.yaml (single owner of
# core2_display/core2_touchscreen), dispatched on core2_page: 0 = selector
# list, 1 = single-light detail.

globals:
  - id: core2_page
    type: int
    restore_value: false
    initial_value: '0'
  - id: core2_selector_scroll_y
    type: int
    restore_value: false
    initial_value: '0'
  - id: core2_selector_touch_start_y
    type: int
    restore_value: false
    initial_value: '-1'
  - id: core2_selector_touch_start_scroll
    type: int
    restore_value: false
    initial_value: '0'
  - id: core2_selector_drag_moved
    type: bool
    restore_value: false
    initial_value: 'false'

script:
  - id: core2_open_light_detail
    parameters:
      index: int
    then:
      - lambda: |-
          id(core2_light_index) = index;
          id(core2_active_light_entity) = id(core2_light_entities)[index];
          id(core2_page) = 1;
      - script.execute: core2_refresh_light_state
      - component.update: core2_display
