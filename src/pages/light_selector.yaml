# Light selector state. Its LVGL widgets live in menu.yaml, which owns the
# single LVGL configuration.

globals:
  - id: core2_page
    type: int
    restore_value: false
    initial_value: '0'

script:
  - id: core2_open_light_detail
    parameters:
      index: int
    then:
      - lambda: |-
          id(core2_light_index) = index;
          id(core2_active_light_entity) = id(core2_light_entities)[index];
          id(core2_page) = 1;
      - script.execute: core2_refresh_light_state
      - lvgl.page.show: core2_light_detail_page

  - id: core2_refresh_light_widgets
    then:
      - lvgl.widget.refresh: core2_light1_name_label
      - lvgl.widget.refresh: core2_light1_state_label
      - lvgl.widget.refresh: core2_light2_name_label
      - lvgl.widget.refresh: core2_light2_state_label
      - lvgl.widget.refresh: core2_light3_name_label
      - lvgl.widget.refresh: core2_light3_state_label
      - lvgl.widget.refresh: core2_light4_name_label
      - lvgl.widget.refresh: core2_light4_state_label
      - lvgl.widget.refresh: core2_light5_name_label
      - lvgl.widget.refresh: core2_light5_state_label
      - lvgl.widget.refresh: core2_light6_name_label
      - lvgl.widget.refresh: core2_light6_state_label
      - lvgl.widget.refresh: core2_detail_title
      - lvgl.widget.refresh: core2_brightness_slider
      - lvgl.widget.refresh: core2_hue_slider
      - lvgl.widget.refresh: core2_kelvin_slider