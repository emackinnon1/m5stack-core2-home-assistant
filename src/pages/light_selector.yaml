# Light selector (scrollable list) + individual light detail, on one screen.
# ESPHome's `!extend` replaces a component's whole lambda/trigger set, so both
# "pages" have to live in a single display lambda / touchscreen trigger set,
# dispatched on core2_page. 0 = selector list, 1 = single-light detail.

globals:
  - id: core2_page
    type: int
    restore_value: false
    initial_value: '0'
  - id: core2_selector_scroll_y
    type: int
    restore_value: false
    initial_value: '0'
  - id: core2_selector_touch_start_y
    type: int
    restore_value: false
    initial_value: '-1'
  - id: core2_selector_touch_start_scroll
    type: int
    restore_value: false
    initial_value: '0'
  - id: core2_selector_drag_moved
    type: bool
    restore_value: false
    initial_value: 'false'

script:
  - id: core2_open_light_detail
    parameters:
      index: int
    then:
      - lambda: |-
          id(core2_light_index) = index;
          id(core2_active_light_entity) = id(core2_light_entities)[index];
          id(core2_page) = 1;
      - script.execute: core2_refresh_light_state
      - component.update: core2_display

display:
  - id: !extend core2_display
    lambda: |-
      static const int HEADER_H = 32;
      static const int ROW_H = 54;

      it.fill(Color(0, 0, 0));
      it.filled_rectangle(0, 0, 320, HEADER_H, Color(28, 28, 32));

      int index = id(core2_light_index);
      const bool has_index = index >= 0 && index < 6 && !id(core2_light_names)[index].empty();
      it.print(10, 4, id(roboto), Color(255, 255, 255),
               id(core2_page) == 0 ? "Lights" :
               (has_index ? id(core2_light_names)[index].c_str() : "No lights configured"));

      it.rectangle(240, 10, 14, 10, Color(175, 175, 175));
      it.filled_rectangle(254, 13, 3, 4, Color(175, 175, 175));
      if (!isnan(id(core2_battery_level).state)) {
        int battery_fill = std::max(1, std::min(11, (int) (id(core2_battery_level).state * 11 / 100)));
        it.filled_rectangle(241, 11, battery_fill, 8, Color(255, 196, 60));
      }
      if (isnan(id(core2_battery_level).state)) {
        it.print(270, 4, id(roboto), Color(175, 175, 175), "--%");
      } else {
        it.printf(260, 4, id(roboto), Color(175, 175, 175), "%.0f%%", id(core2_battery_level).state);
      }

      if (id(core2_page) == 0) {
        int visible_count = 0;
        for (int i = 0; i < 6; i++) if (!id(core2_light_names)[i].empty()) visible_count++;
        if (visible_count == 0) return;

        const int view_h = 240 - HEADER_H;
        const int content_h = visible_count * ROW_H;
        const int max_scroll = std::max(0, content_h - view_h);
        if (id(core2_selector_scroll_y) > max_scroll) id(core2_selector_scroll_y) = max_scroll;
        if (id(core2_selector_scroll_y) < 0) id(core2_selector_scroll_y) = 0;

        int slot = 0;
        for (int i = 0; i < 6; i++) {
          if (id(core2_light_names)[i].empty()) continue;
          const int row_y = HEADER_H + slot * ROW_H - id(core2_selector_scroll_y);
          slot++;
          if (row_y + ROW_H < HEADER_H || row_y > 240) continue;

          const bool is_on = i == 0 ? id(core2_light1_state).state == "on" :
                              i == 1 ? id(core2_light2_state).state == "on" :
                              i == 2 ? id(core2_light3_state).state == "on" :
                              i == 3 ? id(core2_light4_state).state == "on" :
                              i == 4 ? id(core2_light5_state).state == "on" :
                                       id(core2_light6_state).state == "on";
          const float bright_raw = i == 0 ? id(core2_light1_brightness).state :
                                    i == 1 ? id(core2_light2_brightness).state :
                                    i == 2 ? id(core2_light3_brightness).state :
                                    i == 3 ? id(core2_light4_brightness).state :
                                    i == 4 ? id(core2_light5_brightness).state :
                                             id(core2_light6_brightness).state;

          const Color row_bg = is_on ? Color(82, 60, 22) : Color(28, 28, 32);
          const Color accent = is_on ? Color(255, 196, 60) : Color(105, 105, 110);
          it.filled_rectangle(10, row_y + 4, 300, ROW_H - 8, row_bg);
          it.rectangle(10, row_y + 4, 300, ROW_H - 8, accent);
          it.print(24, row_y + 6, id(roboto_small), Color(255, 255, 255), id(core2_light_names)[i].c_str());

          if (is_on && !isnan(bright_raw)) {
            const int pct = (int) (bright_raw * 100.0f / 255.0f + 0.5f);
            it.printf(24, row_y + 28, id(roboto_small), Color(175, 175, 175), "ON  %d%%", pct);
          } else {
            it.print(24, row_y + 28, id(roboto_small), Color(175, 175, 175), is_on ? "ON" : "OFF");
          }
        }

        if (max_scroll > 0) {
          const int track_h = view_h - 8;
          const int thumb_h = std::max(16, track_h * view_h / content_h);
          const int thumb_y = HEADER_H + 4 + (track_h - thumb_h) * id(core2_selector_scroll_y) / max_scroll;
          it.filled_rectangle(314, thumb_y, 4, thumb_h, Color(105, 105, 110));
        }
        return;
      }

      if (!has_index) return;

      const bool is_on = index == 0 ? id(core2_light1_state).state == "on" :
                          index == 1 ? id(core2_light2_state).state == "on" :
                          index == 2 ? id(core2_light3_state).state == "on" :
                          index == 3 ? id(core2_light4_state).state == "on" :
                          index == 4 ? id(core2_light5_state).state == "on" :
                                       id(core2_light6_state).state == "on";
      Color accent = is_on ? Color(255, 196, 60) : Color(95, 95, 95);

      it.filled_rectangle(13, 45, 72, 48, Color(16, 16, 18));
      it.filled_rectangle(10, 42, 72, 48, is_on ? Color(82, 60, 22) : Color(48, 48, 52));
      it.rectangle(10, 42, 72, 48, is_on ? Color(255, 196, 60) : Color(105, 105, 110));
      it.image(28, 48, id(core2_light_power_icon));
      it.printf(100, 43, id(roboto), Color(175, 175, 175), "BRIGHT %d%%", id(core2_light_brightness));
      it.filled_rectangle(100, 76, 200, 8, Color(48, 48, 52));
      it.filled_rectangle(100, 76, id(core2_light_brightness) * 200 / 100, 8, accent);
      int brightness_x = 100 + id(core2_light_brightness) * 200 / 100;
      it.filled_circle(brightness_x, 80, 7, Color(255, 255, 255));

      it.print(10, 100, id(roboto), Color(175, 175, 175), "COLOR");
      for (int x = 0; x < 300; x++) {
        int hue = x * 359 / 299;
        int segment = hue / 60;
        int fade = hue % 60 * 255 / 59;
        int inverse = 255 - fade;
        int red = segment == 0 || segment == 5 ? 255 : (segment == 1 ? inverse : (segment == 4 ? fade : 0));
        int green = segment == 1 || segment == 2 ? 255 : (segment == 0 ? fade : (segment == 3 ? inverse : 0));
        int blue = segment == 3 || segment == 4 ? 255 : (segment == 2 ? fade : (segment == 5 ? inverse : 0));
        it.filled_rectangle(10 + x, 130, 1, 32, Color(red, green, blue));
      }
      int marker_x = 10 + id(core2_light_hue) * 299 / 359;
      it.rectangle(marker_x - 2, 128, 5, 36, Color(255, 255, 255));

      it.printf(10, 166, id(roboto), Color(175, 175, 175), "KELVIN  %dK", id(core2_light_kelvin));
      for (int x = 0; x < 300; x++) {
        int coolness = x * 255 / 299;
        int red = 255 - coolness * 65 / 255;
        int green = 126 + coolness * 94 / 255;
        int blue = 42 + coolness * 213 / 255;
        it.filled_rectangle(10 + x, 198, 1, 32, Color(red, green, blue));
      }
      int kelvin_marker_x = 10 + (id(core2_light_kelvin) - 1500) * 299 / 5000;
      it.rectangle(kelvin_marker_x - 2, 196, 5, 36, Color(255, 255, 255));

touchscreen:
  - id: !extend core2_touchscreen
    on_touch:
      - lambda: |-
          if (id(core2_page) == 0) {
            if (id(core2_selector_touch_start_y) < 0) {
              id(core2_selector_touch_start_y) = touch.y;
              id(core2_selector_touch_start_scroll) = id(core2_selector_scroll_y);
              id(core2_selector_drag_moved) = false;
            }
            return;
          }

          int index = id(core2_light_index);
          if (index < 0 || index >= 6 || id(core2_light_names)[index].empty()) return;
          id(core2_active_light_entity) = id(core2_light_entities)[index];
          int ty = touch.y;
          if (ty < 0 || ty >= 240) return;
          if (touch.x >= 10 && touch.x < 82 && ty >= 42 && ty < 90) {
            if (index == 0 ? id(core2_light1_state).state == "on" :
                index == 1 ? id(core2_light2_state).state == "on" :
                index == 2 ? id(core2_light3_state).state == "on" :
                index == 3 ? id(core2_light4_state).state == "on" :
                index == 4 ? id(core2_light5_state).state == "on" :
                             id(core2_light6_state).state == "on") {
              id(core2_turn_off_light).execute();
            } else {
              id(core2_turn_on_light).execute();
            }
          } else if (touch.x >= 10 && touch.x < 310 && ty >= 130 && ty < 162) {
            int hue = (touch.x - 10) * 359 / 299;
            int segment = hue / 60;
            int fade = hue % 60 * 255 / 59;
            int inverse = 255 - fade;
            id(core2_light_hue) = hue;
            id(core2_light_red) = segment == 0 || segment == 5 ? 255 : (segment == 1 ? inverse : (segment == 4 ? fade : 0));
            id(core2_light_green) = segment == 1 || segment == 2 ? 255 : (segment == 0 ? fade : (segment == 3 ? inverse : 0));
            id(core2_light_blue) = segment == 3 || segment == 4 ? 255 : (segment == 2 ? fade : (segment == 5 ? inverse : 0));
            id(core2_set_light_color).execute();
          } else if (touch.x >= 10 && touch.x < 310 && ty >= 198 && ty < 230) {
            id(core2_light_kelvin) = 1500 + (touch.x - 10) * 5000 / 299;
            id(core2_set_light_kelvin).execute();
          } else if (touch.x >= 94 && touch.x < 310 && ty >= 42 && ty < 90) {
            id(core2_light_brightness) = std::max(0, std::min(100, (touch.x - 100) * 100 / 200));
            id(core2_set_light_brightness).execute();
          }
          id(core2_display)->update();
    on_update:
      - lambda: |-
          if (id(core2_page) != 0) return;
          if (id(core2_selector_touch_start_y) < 0 || touches.empty()) return;

          const auto &t = touches[0];
          const int delta = id(core2_selector_touch_start_y) - t.y;
          if (abs(delta) > 6) id(core2_selector_drag_moved) = true;

          int visible_count = 0;
          for (int i = 0; i < 6; i++) if (!id(core2_light_names)[i].empty()) visible_count++;
          const int content_h = visible_count * 54;
          const int max_scroll = std::max(0, content_h - (240 - 32));

          int new_scroll = id(core2_selector_touch_start_scroll) + delta;
          if (new_scroll < 0) new_scroll = 0;
          if (new_scroll > max_scroll) new_scroll = max_scroll;
          id(core2_selector_scroll_y) = new_scroll;
          id(core2_display)->update();
    on_release:
      - lambda: |-
          if (id(core2_page) != 0) {
            id(core2_selector_touch_start_y) = -1;
            return;
          }
          if (id(core2_selector_touch_start_y) < 0) return;

          if (!id(core2_selector_drag_moved)) {
            const int content_y = id(core2_selector_touch_start_y) + id(core2_selector_scroll_y) - 32;
            if (content_y >= 0) {
              const int row_slot = content_y / 54;
              int slot = 0;
              for (int i = 0; i < 6; i++) {
                if (id(core2_light_names)[i].empty()) continue;
                if (slot == row_slot) {
                  id(core2_open_light_detail).execute(i);
                  break;
                }
                slot++;
              }
            }
          }
          id(core2_selector_touch_start_y) = -1;

# virtual buttons in the capacitive strip below the visible screen; behavior
# depends on which page is showing (core2_page)
binary_sensor:
  - platform: touchscreen
    id: core2_button_a
    internal: true
    x_min: 10
    x_max: 120
    y_min: 240
    y_max: 280
    use_raw: true
    on_press:
      - lambda: |-
          if (id(core2_page) == 0) {
            int new_scroll = id(core2_selector_scroll_y) - 54;
            if (new_scroll < 0) new_scroll = 0;
            id(core2_selector_scroll_y) = new_scroll;
          } else {
            id(core2_page) = 0;
          }
      - component.update: core2_display

  - platform: touchscreen
    id: core2_button_b
    internal: true
    x_min: 130
    x_max: 200
    y_min: 240
    y_max: 280
    use_raw: true
    on_press:
      - lambda: |-
          if (id(core2_page) == 0) {
            int visible_count = 0;
            for (int i = 0; i < 6; i++) if (!id(core2_light_names)[i].empty()) visible_count++;
            if (visible_count == 0) return;
            const int row_slot = id(core2_selector_scroll_y) / 54;
            int slot = 0;
            for (int i = 0; i < 6; i++) {
              if (id(core2_light_names)[i].empty()) continue;
              if (slot == row_slot) {
                id(core2_active_light_entity) = id(core2_light_entities)[i];
                const bool is_on = i == 0 ? id(core2_light1_state).state == "on" :
                                    i == 1 ? id(core2_light2_state).state == "on" :
                                    i == 2 ? id(core2_light3_state).state == "on" :
                                    i == 3 ? id(core2_light4_state).state == "on" :
                                    i == 4 ? id(core2_light5_state).state == "on" :
                                             id(core2_light6_state).state == "on";
                if (is_on) id(core2_turn_off_light).execute(); else id(core2_turn_on_light).execute();
                break;
              }
              slot++;
            }
          } else {
            int idx = id(core2_light_index);
            if (idx < 0 || idx >= 6 || id(core2_light_names)[idx].empty()) return;
            id(core2_active_light_entity) = id(core2_light_entities)[idx];
            if (idx == 0 ? id(core2_light1_state).state == "on" :
                idx == 1 ? id(core2_light2_state).state == "on" :
                idx == 2 ? id(core2_light3_state).state == "on" :
                idx == 3 ? id(core2_light4_state).state == "on" :
                idx == 4 ? id(core2_light5_state).state == "on" :
                           id(core2_light6_state).state == "on") {
              id(core2_turn_off_light).execute();
            } else {
              id(core2_turn_on_light).execute();
            }
          }

  - platform: touchscreen
    id: core2_button_c
    internal: true
    x_min: 230
    x_max: 310
    y_min: 240
    y_max: 280
    use_raw: true
    on_press:
      - lambda: |-
          if (id(core2_page) == 0) {
            int visible_count = 0;
            for (int i = 0; i < 6; i++) if (!id(core2_light_names)[i].empty()) visible_count++;
            const int max_scroll = std::max(0, visible_count * 54 - (240 - 32));
            int new_scroll = id(core2_selector_scroll_y) + 54;
            if (new_scroll > max_scroll) new_scroll = max_scroll;
            id(core2_selector_scroll_y) = new_scroll;
          } else {
            id(core2_page) = 0;
          }
      - component.update: core2_display
