# LVGL owns rendering on the visible 320x240 display. The capacitive strip
# below it remains a raw touchscreen binary-sensor surface.

globals:
  - id: core2_screen
    type: int
    restore_value: false
    initial_value: '0'

image:
  - platform: file
    file: src/assets/images/bulb.png
    id: core2_menu_icon_lights
    type: RGB565
    transparency: alpha_channel
    resize: 34x34
  - platform: file
    file: src/assets/images/ac_logo.png
    id: core2_menu_icon_climate
    type: RGB565
    transparency: alpha_channel
    resize: 32x32
  - platform: file
    file: src/assets/images/music.png
    id: core2_menu_icon_media
    type: RGB565
    transparency: alpha_channel
    resize: 34x34
  - platform: file
    file: src/assets/images/cloudy.png
    id: core2_menu_icon_weather
    type: RGB565
    transparency: alpha_channel
    resize: 34x34

script:
  - id: core2_open_menu
    then:
      - globals.set: {id: core2_screen, value: '0'}
      - lvgl.page.show: core2_menu_page
  - id: core2_open_lights
    then:
      - globals.set: {id: core2_screen, value: '1'}
      - globals.set: {id: core2_page, value: '0'}
      - lvgl.page.show: core2_lights_page
  - id: core2_open_climate
    then:
      - globals.set: {id: core2_screen, value: '2'}
      - lvgl.page.show: core2_climate_page
  - id: core2_open_media
    then:
      - globals.set: {id: core2_screen, value: '3'}
      - lvgl.page.show: core2_media_page
  - id: core2_open_weather
    then:
      - globals.set: {id: core2_screen, value: '4'}
      - lvgl.page.show: core2_weather_page
  - id: core2_back_to_menu
    then:
      - globals.set: {id: core2_screen, value: '0'}
      - lvgl.page.show: core2_menu_page

lvgl:
  displays: [core2_display]
  touchscreens:
    - touchscreen_id: core2_touchscreen
  default_font: roboto_small
  theme:
    dark_mode: true
  gradients:
    - id: core2_hue_gradient
      direction: HOR
      stops:
        - color: 0xFF0000
          position: 0
        - color: 0xFFFF00
          position: 42
        - color: 0x00FF00
          position: 84
        - color: 0x00FFFF
          position: 127
        - color: 0x0000FF
          position: 169
        - color: 0xFF00FF
          position: 212
        - color: 0xFF0000
          position: 255
    - id: core2_kelvin_gradient
      direction: HOR
      stops:
        - color: 0xFF7E2A
          position: 0
        - color: 0xFFD090
          position: 127
        - color: 0xBCE8FF
          position: 255
  pages:
    - id: core2_menu_page
      bg_color: 0x000000
      widgets:
        - label:
            x: 10
            y: 5
            text: Menu
            text_font: roboto
            text_color: 0xFFFFFF
        - button:
            x: 10
            y: 40
            width: 145
            height: 88
            radius: 0
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            on_click:
              - script.execute: core2_open_lights
            widgets:
              - image:
                  align: TOP_MID
                  y: 12
                  src: core2_menu_icon_lights
              - label:
                  align: BOTTOM_MID
                  y: -10
                  text: Lights
                  text_color: 0xFFFFFF
        - button:
            x: 165
            y: 40
            width: 145
            height: 88
            radius: 0
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            on_click:
              - script.execute: core2_open_climate
            widgets:
              - image:
                  align: TOP_MID
                  y: 14
                  src: core2_menu_icon_climate
              - label:
                  align: BOTTOM_MID
                  y: -10
                  text: Climate
                  text_color: 0xFFFFFF
        - button:
            x: 10
            y: 136
            width: 145
            height: 88
            radius: 0
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            on_click:
              - script.execute: core2_open_media
            widgets:
              - image:
                  align: TOP_MID
                  y: 12
                  src: core2_menu_icon_media
              - label:
                  align: BOTTOM_MID
                  y: -10
                  text: Media
                  text_color: 0xFFFFFF
        - button:
            x: 165
            y: 136
            width: 145
            height: 88
            radius: 0
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            on_click:
              - script.execute: core2_open_weather
            widgets:
              - image:
                  align: TOP_MID
                  y: 12
                  src: core2_menu_icon_weather
              - label:
                  align: BOTTOM_MID
                  y: -10
                  text: Weather
                  text_color: 0xFFFFFF
    - id: core2_lights_page
      bg_color: 0x000000
      on_load:
        - script.execute: core2_refresh_light_widgets
      widgets:
        - button:
            x: 6
            y: 4
            width: 28
            height: 28
            text: "<"
            text_font: roboto
            bg_opa: TRANSP
            border_width: 0
            on_click:
              - script.execute: core2_back_to_menu
        - label:
            x: 38
            y: 5
            text: Lights
            text_font: roboto
            text_color: 0xFFFFFF
        - container:
            x: 0
            y: 32
            width: 320
            height: 208
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scroll_dir: VER
            scrollbar_mode: "AUTO"
            widgets:
              - button:
                  x: 10
                  y: 4
                  width: 300
                  height: 33
                  hidden: !lambda 'return id(core2_light_names)[0].empty();'
                  radius: 0
                  bg_color: 0x1C1C20
                  border_width: 1
                  border_color: 0x69696E
                  on_click:
                    - script.execute: {id: core2_open_light_detail, index: 0}
                  widgets:
                    - label:
                        id: core2_light1_name_label
                        x: 12
                        y: 7
                        text: !lambda 'return id(core2_light_names)[0];'
                        text_color: 0xFFFFFF
                    - label:
                        id: core2_light1_state_label
                        x: 220
                        y: 7
                        width: 64
                        text_align: RIGHT
                        text: !lambda 'return std::string(id(core2_light1_state).state == "on" ? "ON" : "OFF");'
                        text_color: 0xAFAFAF
              - button:
                  x: 10
                  y: 41
                  width: 300
                  height: 33
                  hidden: !lambda 'return id(core2_light_names)[1].empty();'
                  radius: 0
                  bg_color: 0x1C1C20
                  border_width: 1
                  border_color: 0x69696E
                  on_click:
                    - script.execute: {id: core2_open_light_detail, index: 1}
                  widgets:
                    - label:
                        id: core2_light2_name_label
                        x: 12
                        y: 7
                        text: !lambda 'return id(core2_light_names)[1];'
                        text_color: 0xFFFFFF
                    - label:
                        id: core2_light2_state_label
                        x: 220
                        y: 7
                        width: 64
                        text_align: RIGHT
                        text: !lambda 'return std::string(id(core2_light2_state).state == "on" ? "ON" : "OFF");'
                        text_color: 0xAFAFAF
              - button:
                  x: 10
                  y: 78
                  width: 300
                  height: 33
                  hidden: !lambda 'return id(core2_light_names)[2].empty();'
                  radius: 0
                  bg_color: 0x1C1C20
                  border_width: 1
                  border_color: 0x69696E
                  on_click:
                    - script.execute: {id: core2_open_light_detail, index: 2}
                  widgets:
                    - label:
                        id: core2_light3_name_label
                        x: 12
                        y: 7
                        text: !lambda 'return id(core2_light_names)[2];'
                        text_color: 0xFFFFFF
                    - label:
                        id: core2_light3_state_label
                        x: 220
                        y: 7
                        width: 64
                        text_align: RIGHT
                        text: !lambda 'return std::string(id(core2_light3_state).state == "on" ? "ON" : "OFF");'
                        text_color: 0xAFAFAF
              - button:
                  x: 10
                  y: 115
                  width: 300
                  height: 33
                  hidden: !lambda 'return id(core2_light_names)[3].empty();'
                  radius: 0
                  bg_color: 0x1C1C20
                  border_width: 1
                  border_color: 0x69696E
                  on_click:
                    - script.execute: {id: core2_open_light_detail, index: 3}
                  widgets:
                    - label:
                        id: core2_light4_name_label
                        x: 12
                        y: 7
                        text: !lambda 'return id(core2_light_names)[3];'
                        text_color: 0xFFFFFF
                    - label:
                        id: core2_light4_state_label
                        x: 220
                        y: 7
                        width: 64
                        text_align: RIGHT
                        text: !lambda 'return std::string(id(core2_light4_state).state == "on" ? "ON" : "OFF");'
                        text_color: 0xAFAFAF
              - button:
                  x: 10
                  y: 152
                  width: 300
                  height: 33
                  hidden: !lambda 'return id(core2_light_names)[4].empty();'
                  radius: 0
                  bg_color: 0x1C1C20
                  border_width: 1
                  border_color: 0x69696E
                  on_click:
                    - script.execute: {id: core2_open_light_detail, index: 4}
                  widgets:
                    - label:
                        id: core2_light5_name_label
                        x: 12
                        y: 7
                        text: !lambda 'return id(core2_light_names)[4];'
                        text_color: 0xFFFFFF
                    - label:
                        id: core2_light5_state_label
                        x: 220
                        y: 7
                        width: 64
                        text_align: RIGHT
                        text: !lambda 'return std::string(id(core2_light5_state).state == "on" ? "ON" : "OFF");'
                        text_color: 0xAFAFAF
              - button:
                  x: 10
                  y: 189
                  width: 300
                  height: 33
                  hidden: !lambda 'return id(core2_light_names)[5].empty();'
                  radius: 0
                  bg_color: 0x1C1C20
                  border_width: 1
                  border_color: 0x69696E
                  on_click:
                    - script.execute: {id: core2_open_light_detail, index: 5}
                  widgets:
                    - label:
                        id: core2_light6_name_label
                        x: 12
                        y: 7
                        text: !lambda 'return id(core2_light_names)[5];'
                        text_color: 0xFFFFFF
                    - label:
                        id: core2_light6_state_label
                        x: 220
                        y: 7
                        width: 64
                        text_align: RIGHT
                        text: !lambda 'return std::string(id(core2_light6_state).state == "on" ? "ON" : "OFF");'
                        text_color: 0xAFAFAF
    - id: core2_light_detail_page
      bg_color: 0x000000
      on_load:
        - script.execute: core2_refresh_light_widgets
      widgets:
        - button:
            x: 6
            y: 4
            width: 28
            height: 28
            text: "<"
            text_font: roboto
            bg_opa: TRANSP
            border_width: 0
            on_click:
              - lvgl.page.show: core2_lights_page
        - label:
            id: core2_detail_title
            x: 38
            y: 5
            width: 200
            long_mode: DOT
            text: !lambda 'return id(core2_light_names)[id(core2_light_index)];'
            text_font: roboto
            text_color: 0xFFFFFF
        - button:
            id: core2_power_button
            x: 10
            y: 42
            width: 72
            height: 48
            text: Power
            bg_color: !lambda |-
              const int index = id(core2_light_index);
              const bool is_on = index == 0 ? id(core2_light1_state).state == "on" :
                                 index == 1 ? id(core2_light2_state).state == "on" :
                                 index == 2 ? id(core2_light3_state).state == "on" :
                                 index == 3 ? id(core2_light4_state).state == "on" :
                                 index == 4 ? id(core2_light5_state).state == "on" :
                                              id(core2_light6_state).state == "on";
              return lv_color_hex(is_on ? 0xFFC43C : 0x5F5F5F);
            on_click:
              - lambda: |-
                  const int index = id(core2_light_index);
                  const bool is_on = index == 0 ? id(core2_light1_state).state == "on" :
                                     index == 1 ? id(core2_light2_state).state == "on" :
                                     index == 2 ? id(core2_light3_state).state == "on" :
                                     index == 3 ? id(core2_light4_state).state == "on" :
                                     index == 4 ? id(core2_light5_state).state == "on" :
                                                  id(core2_light6_state).state == "on";
                  if (is_on) id(core2_turn_off_light).execute(); else id(core2_turn_on_light).execute();
        - label:
            x: 100
            y: 43
            text: Brightness
            text_font: roboto
            text_color: 0xAFAFAF
        - slider:
            id: core2_brightness_slider
            x: 100
            y: 76
            width: 200
            height: 12
            min_value: 0
            max_value: 100
            value: !lambda 'return id(core2_light_brightness);'
            on_release:
              - lambda: 'id(core2_light_brightness) = x;'
              - script.execute: core2_set_light_brightness
        - label:
            x: 10
            y: 100
            text: Color
            text_font: roboto
            text_color: 0xAFAFAF
        - slider:
            id: core2_hue_slider
            x: 10
            y: 130
            width: 300
            height: 32
            min_value: 0
            max_value: 359
            value: !lambda 'return id(core2_light_hue);'
            bg_grad: core2_hue_gradient
            indicator:
              bg_opa: TRANSP
            on_release:
              - lambda: |-
                  const int hue = x;
                  const int segment = hue / 60;
                  const int fade = hue % 60 * 255 / 59;
                  const int inverse = 255 - fade;
                  id(core2_light_hue) = hue;
                  id(core2_light_red) = segment == 0 || segment == 5 ? 255 : (segment == 1 ? inverse : (segment == 4 ? fade : 0));
                  id(core2_light_green) = segment == 1 || segment == 2 ? 255 : (segment == 0 ? fade : (segment == 3 ? inverse : 0));
                  id(core2_light_blue) = segment == 3 || segment == 4 ? 255 : (segment == 2 ? fade : (segment == 5 ? inverse : 0));
              - script.execute: core2_set_light_color
        - label:
            x: 10
            y: 166
            text: Kelvin
            text_font: roboto
            text_color: 0xAFAFAF
        - slider:
            id: core2_kelvin_slider
            x: 10
            y: 198
            width: 300
            height: 32
            min_value: 1500
            max_value: 6500
            value: !lambda 'return id(core2_light_kelvin);'
            bg_grad: core2_kelvin_gradient
            indicator:
              bg_opa: TRANSP
            on_release:
              - lambda: 'id(core2_light_kelvin) = x;'
              - script.execute: core2_set_light_kelvin
    - id: core2_climate_page
      bg_color: 0x000000
      on_load:
        - script.execute: core2_refresh_climate_state
      widgets:
        - button:
            x: 6
            y: 4
            width: 28
            height: 28
            text: "<"
            text_font: roboto
            bg_opa: TRANSP
            border_width: 0
            on_click:
              - script.execute: core2_back_to_menu
        - label:
            x: 38
            y: 5
            text: Climate
            text_font: roboto
            text_color: 0xFFFFFF
        - label:
            id: core2_climate_current_temp_label
            x: 150
            y: 9
            width: 160
            text_align: RIGHT
            text: !lambda |-
              char buf[32];
              snprintf(buf, sizeof(buf), "Currently: %d\xc2\xb0", (int) id(core2_climate_current_temperature).state);
              return std::string(buf);
            text_color: 0xAFAFAF
        - label:
            id: core2_climate_target_temp_label
            x: 10
            y: 32
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%d\xc2\xb0", (int) id(core2_climate_target_temp));
              return std::string(buf);
            text_font: roboto_large
            text_color: 0xFFFFFF
        - button:
            x: 10
            y: 92
            width: 40
            height: 36
            text: "-"
            text_font: roboto
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            on_click:
              - script.execute: core2_climate_decrease_temp
        - button:
            x: 58
            y: 92
            width: 40
            height: 36
            text: "+"
            text_font: roboto
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            on_click:
              - script.execute: core2_climate_increase_temp
        - label:
            x: 40
            y: 136
            text: Mode
            text_color: 0xAFAFAF
        - button:
            id: core2_climate_hvac_prev_button
            x: 104
            y: 132
            width: 28
            height: 28
            text: "<"
            text_font: roboto
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            hidden: !lambda 'return id(core2_climate_hvac_mode_count) == 0;'
            on_click:
              - script.execute: core2_climate_prev_hvac_mode
        - label:
            id: core2_climate_hvac_label
            x: 136
            y: 136
            width: 116
            text_align: CENTER
            text: !lambda 'return id(core2_climate_state).state;'
            text_color: 0xFFFFFF
        - button:
            id: core2_climate_hvac_next_button
            x: 256
            y: 132
            width: 28
            height: 28
            text: ">"
            text_font: roboto
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            hidden: !lambda 'return id(core2_climate_hvac_mode_count) == 0;'
            on_click:
              - script.execute: core2_climate_next_hvac_mode
        - label:
            x: 40
            y: 174
            text: Fan
            text_color: 0xAFAFAF
        - button:
            id: core2_climate_fan_prev_button
            x: 104
            y: 170
            width: 28
            height: 28
            text: "<"
            text_font: roboto
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            hidden: !lambda 'return id(core2_climate_fan_mode_count) == 0;'
            on_click:
              - script.execute: core2_climate_prev_fan_mode
        - label:
            id: core2_climate_fan_mode_label
            x: 136
            y: 174
            width: 116
            text_align: CENTER
            text: !lambda 'return id(core2_climate_fan_mode).state;'
            text_color: 0xFFFFFF
        - button:
            id: core2_climate_fan_next_button
            x: 256
            y: 170
            width: 28
            height: 28
            text: ">"
            text_font: roboto
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            hidden: !lambda 'return id(core2_climate_fan_mode_count) == 0;'
            on_click:
              - script.execute: core2_climate_next_fan_mode
        - label:
            x: 40
            y: 212
            text: Preset
            text_color: 0xAFAFAF
        - button:
            id: core2_climate_preset_prev_button
            x: 104
            y: 208
            width: 28
            height: 28
            text: "<"
            text_font: roboto
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            hidden: !lambda 'return id(core2_climate_preset_mode_count) == 0;'
            on_click:
              - script.execute: core2_climate_prev_preset_mode
        - label:
            id: core2_climate_preset_mode_label
            x: 136
            y: 212
            width: 116
            text_align: CENTER
            text: !lambda 'return id(core2_climate_preset_mode).state;'
            text_color: 0xFFFFFF
        - button:
            id: core2_climate_preset_next_button
            x: 256
            y: 208
            width: 28
            height: 28
            text: ">"
            text_font: roboto
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            hidden: !lambda 'return id(core2_climate_preset_mode_count) == 0;'
            on_click:
              - script.execute: core2_climate_next_preset_mode
    - id: core2_media_page
      bg_color: 0x000000
      widgets:
        - label:
            align: CENTER
            text: Media coming soon
            text_color: 0xAFAFAF
        - button:
            align: BOTTOM_MID
            y: -10
            text: Menu
            on_click:
              - script.execute: core2_back_to_menu
    - id: core2_weather_page
      bg_color: 0x000000
      widgets:
        - label:
            align: CENTER
            text: Weather coming soon
            text_color: 0xAFAFAF
        - button:
            align: BOTTOM_MID
            y: -10
            text: Menu
            on_click:
              - script.execute: core2_back_to_menu

binary_sensor:
  - platform: touchscreen
    id: core2_button_a
    internal: true
    x_min: 10
    x_max: 120
    y_min: 240
    y_max: 280
    use_raw: true
    on_press:
      - script.execute: core2_back_to_menu
  - platform: touchscreen
    id: core2_button_b
    internal: true
    x_min: 130
    x_max: 200
    y_min: 240
    y_max: 280
    use_raw: true
  - platform: touchscreen
    id: core2_button_c
    internal: true
    x_min: 230
    x_max: 310
    y_min: 240
    y_max: 280
    use_raw: true