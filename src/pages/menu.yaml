# LVGL owns rendering on the visible 320x240 display. The capacitive strip
# below it remains a raw touchscreen binary-sensor surface.

globals:
  - id: core2_screen
    type: int
    restore_value: false
    initial_value: '0'

image:
  - platform: file
    file: src/assets/images/bulb.png
    id: core2_menu_icon_lights
    type: RGB565
    transparency: alpha_channel
    resize: 34x34
  - platform: file
    file: src/assets/images/ac_logo.png
    id: core2_menu_icon_climate
    type: RGB565
    transparency: alpha_channel
    resize: 32x32
  - platform: file
    file: src/assets/images/music.png
    id: core2_menu_icon_media
    type: RGB565
    transparency: alpha_channel
    resize: 34x34
  - platform: file
    file: src/assets/images/cloudy.png
    id: core2_menu_icon_weather
    type: RGB565
    transparency: alpha_channel
    resize: 34x34

script:
  - id: core2_open_menu
    then:
      - globals.set: {id: core2_screen, value: '0'}
      - lvgl.page.show: core2_menu_page
  - id: core2_open_lights
    then:
      - globals.set: {id: core2_screen, value: '1'}
      - globals.set: {id: core2_page, value: '0'}
      - lvgl.page.show: core2_lights_page
  - id: core2_open_climate
    then:
      - globals.set: {id: core2_screen, value: '2'}
      - lvgl.page.show: core2_climate_page
  - id: core2_open_media
    then:
      - globals.set: {id: core2_screen, value: '3'}
      - lvgl.page.show: core2_media_page
  - id: core2_open_weather
    then:
      - globals.set: {id: core2_screen, value: '4'}
      - lvgl.page.show: core2_weather_page
  - id: core2_back_to_menu
    then:
      - globals.set: {id: core2_screen, value: '0'}
      - lvgl.page.show: core2_menu_page

lvgl:
  displays: [core2_display]
  touchscreens:
    - touchscreen_id: core2_touchscreen
  default_font: roboto_small
  theme:
    dark_mode: true
  pages:
    - id: core2_menu_page
      bg_color: 0x000000
      widgets:
        - label:
            x: 10
            y: 5
            text: Menu
            text_font: roboto
            text_color: 0xFFFFFF
        - button:
            x: 10
            y: 40
            width: 145
            height: 88
            radius: 0
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            on_click:
              - script.execute: core2_open_lights
            widgets:
              - image:
                  align: TOP_MID
                  y: 12
                  src: core2_menu_icon_lights
              - label:
                  align: BOTTOM_MID
                  y: -10
                  text: Lights
                  text_color: 0xFFFFFF
        - button:
            x: 165
            y: 40
            width: 145
            height: 88
            radius: 0
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            on_click:
              - script.execute: core2_open_climate
            widgets:
              - image:
                  align: TOP_MID
                  y: 14
                  src: core2_menu_icon_climate
              - label:
                  align: BOTTOM_MID
                  y: -10
                  text: Climate
                  text_color: 0xFFFFFF
        - button:
            x: 10
            y: 136
            width: 145
            height: 88
            radius: 0
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            on_click:
              - script.execute: core2_open_media
            widgets:
              - image:
                  align: TOP_MID
                  y: 12
                  src: core2_menu_icon_media
              - label:
                  align: BOTTOM_MID
                  y: -10
                  text: Media
                  text_color: 0xFFFFFF
        - button:
            x: 165
            y: 136
            width: 145
            height: 88
            radius: 0
            bg_color: 0x1C1C20
            border_width: 1
            border_color: 0x69696E
            on_click:
              - script.execute: core2_open_weather
            widgets:
              - image:
                  align: TOP_MID
                  y: 12
                  src: core2_menu_icon_weather
              - label:
                  align: BOTTOM_MID
                  y: -10
                  text: Weather
                  text_color: 0xFFFFFF
    - id: core2_lights_page
      bg_color: 0x000000
      widgets:
        - button:
            x: 6
            y: 4
            width: 28
            height: 28
            text: "<"
            text_font: roboto
            bg_opa: TRANSP
            border_width: 0
            on_click:
              - script.execute: core2_back_to_menu
        - label:
            x: 38
            y: 5
            text: Lights
            text_font: roboto
            text_color: 0xFFFFFF
        - label:
            align: CENTER
            text: Light list coming next
            text_color: 0xAFAFAF
    - id: core2_climate_page
      bg_color: 0x000000
      widgets:
        - label:
            align: CENTER
            text: Climate coming soon
            text_color: 0xAFAFAF
        - button:
            align: BOTTOM_MID
            y: -10
            text: Menu
            on_click:
              - script.execute: core2_back_to_menu
    - id: core2_media_page
      bg_color: 0x000000
      widgets:
        - label:
            align: CENTER
            text: Media coming soon
            text_color: 0xAFAFAF
        - button:
            align: BOTTOM_MID
            y: -10
            text: Menu
            on_click:
              - script.execute: core2_back_to_menu
    - id: core2_weather_page
      bg_color: 0x000000
      widgets:
        - label:
            align: CENTER
            text: Weather coming soon
            text_color: 0xAFAFAF
        - button:
            align: BOTTOM_MID
            y: -10
            text: Menu
            on_click:
              - script.execute: core2_back_to_menu

binary_sensor:
  - platform: touchscreen
    id: core2_button_a
    internal: true
    x_min: 10
    x_max: 120
    y_min: 240
    y_max: 280
    use_raw: true
    on_press:
      - script.execute: core2_back_to_menu
  - platform: touchscreen
    id: core2_button_b
    internal: true
    x_min: 130
    x_max: 200
    y_min: 240
    y_max: 280
    use_raw: true
  - platform: touchscreen
    id: core2_button_c
    internal: true
    x_min: 230
    x_max: 310
    y_min: 240
    y_max: 280
    use_raw: true